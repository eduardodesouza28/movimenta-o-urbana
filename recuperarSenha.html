<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Carona</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full space-y-8 p-8">
        <div class="text-center">
            <i class="fas fa-car text-blue-600 text-4xl mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-900">Carona Ou Viajem ¿</h2>
            <p class="mt-2 text-sm text-gray-600">Recupere sua senha</p>
        </div>

        <form id="recuperarForm" class="mt-8 space-y-6 bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-xl font-bold text-center text-gray-800">Recuperar Senha</h1>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">
                    <i class="fas fa-envelope mr-1"></i>
                    Email:
                </label>
                <input type="email" id="email" name="email" required
                       class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Digite seu email cadastrado">
            </div>

            <button type="submit" 
                    class="w-full py-2 px-4 bg-orange-600 text-white font-medium rounded-md hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 transition duration-300">
                <i class="fas fa-paper-plane mr-2"></i>
                Enviar Email de Recuperação
            </button>
        
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <p class="text-sm text-blue-800">
                    <i class="fas fa-info-circle mr-1"></i>
                    <strong>Instruções:</strong> Você receberá um email com instruções para recuperar sua senha.
                </p>
            </div>
        
            <div class="text-center">
                <a href="login.html" class="text-sm text-blue-600 hover:text-blue-800 transition duration-300">
                    <i class="fas fa-arrow-left mr-1"></i>
                    Voltar para o Login
                </a>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
