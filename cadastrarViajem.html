<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar / Disponível</title>
</head>
<body>
    <form action="/cadastrar-viajem" method="POST">
        <h1>Cadastrar Viagem</h1>

        <label for="origem">Origem:</label>
        <input type="text" id="origem" name="origem" required>

        <label for="destino">Destino:</label>
        <input type="text" id="destino" name="destino" required>

        <label for="data">Data da Viagem:</label>
        <input type="date" id="data" name="data" required>

        <label for="horario">Horário de Saída:</label>
        <input type="time" id="horario" name="horario" required>

        <label for="vagas">Número de Vagas:</label>
        <input type="number" id="vagas" name="vagas" min="1" required>

        <button type="submit">Cadastrar Viagem</button>
    </form>
    
</body>
</html>
