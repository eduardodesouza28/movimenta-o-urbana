<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Carona</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full space-y-8 p-8">
        <div class="text-center">
            <i class="fas fa-car text-blue-600 text-4xl mb-4"></i>
            <h2 class="text-3xl font-bold text-gray-900">Carona Ou Viajem ¿</h2>
            <p class="mt-2 text-sm text-gray-600">Crie sua conta</p>
        </div>

        <form id="cadastroForm" class="mt-8 space-y-6 bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-xl font-bold text-center text-gray-800">Criar Conta</h1>

            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700">
                    <i class="fas fa-user mr-1"></i>
                    Nome Completo:
                </label>
                <input type="text" id="nome" name="nome" required
                       class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Seu nome completo">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">
                    <i class="fas fa-envelope mr-1"></i>
                    Email:
                </label>
                <input type="email" id="email" name="email" required
                       class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="seu@email.com">
            </div>

            <div>
                <label for="telefone" class="block text-sm font-medium text-gray-700">
                    <i class="fas fa-phone mr-1"></i>
                    Telefone (Opcional):
                </label>
                <input type="tel" id="telefone" name="telefone"
                       class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="(11) 99999-9999">
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700">
                    <i class="fas fa-lock mr-1"></i>
                    Senha:
                </label>
                <input type="password" id="senha" name="senha" required minlength="6"
                       class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Mínimo 6 caracteres">
            </div>

            <button type="submit" 
                    class="w-full py-2 px-4 bg-green-600 text-white font-medium rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition duration-300">
                <i class="fas fa-user-plus mr-2"></i>
                Criar Conta
            </button>
            
            <div class="text-center space-y-2">
                <a href="login.html" class="block text-sm text-blue-600 hover:text-blue-800 transition duration-300">
                    Já tem conta? Faça login
                </a>
                <a href="index.html" class="block text-sm text-gray-600 hover:text-gray-800 transition duration-300">
                    <i class="fas fa-arrow-left mr-1"></i>
                    Voltar ao início
                </a>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
